name: The Atavist
description: >-
  The Atavist is a pioneering digital longform-storytelling brand founded in 2009 by
  Evan Ratliff, Jefferson Rabb, and Nicholas Thompson. It comprises The Atavist Magazine,
  which publishes one immersive work of narrative nonfiction each month and has earned
  National Magazine Award and Emmy recognition, and the Atavist multimedia publishing
  platform for building rich, media-driven stories. Automattic (the company behind
  WordPress.com) acquired both the magazine and the platform in 2018; the platform's
  storytelling features were folded into WordPress.com and the magazine now runs on
  Newspack by Automattic. The Atavist exposes no public developer API or documented
  developer program — it is a reader-facing publication at magazine.atavist.com.
